[package]
name = "doing-desktop"
version = "0.1.0"
description = "Doing 桌面客户端（Tauri 2 + React + Rust）"
edition = "2021"

[lib]
name = "doing_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
doing-core = { path = "../crates/doing-core" }
doing-notifications = { path = "../crates/doing-notifications" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
thiserror = "2"
base64 = "0.22"
ts-rs = "12.0.1"
sha2 = "0.10"
plist = "1.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUserDefaults", "NSPropertyList", "NSData", "NSDictionary", "NSString", "NSURL", "NSArray", "NSError", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSScreen"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-deep-link = "2.4.10"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
