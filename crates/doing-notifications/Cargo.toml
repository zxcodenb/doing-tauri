[package]
name = "doing-notifications"
version = "0.1.0"
edition = "2021"
description = "Thin native notification delivery and activation adapters for Doing"

[dependencies]
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSBundle", "NSURL", "NSError"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT", "Win32_Foundation"] }
